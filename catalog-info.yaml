  system: admin-tools
  definition: |
    ## Django DashMin Library API
    
    ### ModelDashmin Class
    - **Purpose**: Base class for creating custom admin interfaces for Django models
    - **Key Features**:
      - Customizable list display configuration
      - Built-in filtering capabilities  
      - Search field support
      - Template customization
    
    ### Available Views
    - **DashminModelCreateView**: Handle model creation
    - **DashminModelListView**: Display model listings with pagination and filtering
    - **DashminModelUpdateView**: Handle model updates
    
    ### Registration System
    - **register()**: Function to register models with the dashmin admin interface
    - **autodiscover_modules()**: Automatically discover dashboard modules in Django apps
    
    ### Template Structure
    - Base admin templates with customizable blocks
    - Model-specific templates for CRUD operations
    - User authentication templates